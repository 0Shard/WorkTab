name: Create Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ✅ 获取完整提交历史
          fetch-tags: true   # ✅ 确保所有 tag 被拉取

      - name: Generate grouped and pretty changelog
        id: changelog
        run: |
          # 获取上一个 tag（排除当前 tag）
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)
          
          echo "CURRENT_TAG: $CURRENT_TAG"

          # 判断是否为首次发布
          if [ -z "$PREV_TAG" ]; then
            echo "🔔 No previous tag found. Using initial commit as range."
            GIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            echo "📌 Previous tag: $PREV_TAG"
            GIT_RANGE=$PREV_TAG..$CURRENT_TAG
          fi

          # 准备分组 changelog（带 emoji）
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "## ✨ Features" >> $GITHUB_ENV
          git log $GIT_RANGE --pretty=format:"%s (%an)" | grep -iE '^feat' | sed 's/^/ - /' >> $GITHUB_ENV || echo " - No new features" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          echo "## 🐛 Fixes" >> $GITHUB_ENV
          git log $GIT_RANGE --pretty=format:"%s (%an)" | grep -iE '^fix' | sed 's/^/ - /' >> $GITHUB_ENV || true
          echo "" >> $GITHUB_ENV

          echo "## 🧰 Others" >> $GITHUB_ENV
          git log $GIT_RANGE --pretty=format:"%s (%an)" | grep -viE '^(fix|feat)' | sed 's/^/ - /' >> $GITHUB_ENV || true
          echo "EOF" >> $GITHUB_ENV

      - name: Create zip file
        run: |
          mkdir release
          rsync -av \
            --exclude='Source/' \
            --exclude='release/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            ./ ./release/
          cd release
          zip -r "../WorkTab-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.16.0
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: WorkTab-${{ github.ref_name }}.zip
          generateReleaseNotes: true
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
