name: Create Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # ✅ 获取完整提交历史
          fetch-tags: true   # ✅ 确保所有 tag 被拉取

      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -n 1)

          echo "📌 Current tag: $CURRENT_TAG"
          echo "📌 Previous tag: $PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            echo "🔔 No previous tag found. Using initial commit as range."
            GIT_RANGE=$(git rev-list --max-parents=0 HEAD)..HEAD
          else
            GIT_RANGE=$PREV_TAG..$CURRENT_TAG
          fi

          # 获取提交列表并排除提交信息等于当前tag的提交
          COMMITS=$(git log $GIT_RANGE --pretty=format:"%s||%an" | awk -F'||' -v tag="$CURRENT_TAG" '$1 != tag')
          
          # 去除当前触发者的提交
          FILTERED_COMMITS=$(echo "$COMMITS" | grep -vi "||${{ github.actor }}$")

          # 获取唯一作者列表（贡献者）
          CONTRIBUTORS=$(echo "$FILTERED_COMMITS" | cut -d"|" -f2 | sort -fu)

          format_author_links() {
            echo "$1" | while IFS= read -r line; do
              # 跳过空行
              [ -z "$line" ] && continue

              message=$(echo "$line" | cut -d"|" -f1)
              author=$(echo "$line" | cut -d"|" -f2)

              # 只有作者不为空才显示
              if [ -n "$author" ]; then
                echo " - $message (by @$author)"
              else
                echo " - $message"
              fi
            done
          }  

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV

          echo "## ✨ Features" >> $GITHUB_ENV
          format_author_links "$(echo "$FILTERED_COMMITS" | grep -iE '^feat')" >> $GITHUB_ENV || echo " - No new features" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          echo "## 🐛 Fixes" >> $GITHUB_ENV
          format_author_links "$(echo "$FILTERED_COMMITS" | grep -iE '^fix')" >> $GITHUB_ENV || echo " - No fixes" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          echo "## 🧰 Others" >> $GITHUB_ENV
          format_author_links "$(echo "$FILTERED_COMMITS" | grep -viE '^(fix|feat)')" >> $GITHUB_ENV || echo " - No other changes" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          # 只在有贡献者且贡献者不为空时显示 New Contributors
          if [ -n "$CONTRIBUTORS" ]; then
            CLEANED_CONTRIBUTORS=$(echo "$CONTRIBUTORS" | grep -vi "^${{ github.actor }}$" | grep -v '^\s*$')
            if [ -n "$CLEANED_CONTRIBUTORS" ]; then
              echo "## 👥 New Contributors" >> $GITHUB_ENV
              echo "$CLEANED_CONTRIBUTORS" | sed 's/^/ - @/' >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
            fi
          fi

          echo "EOF" >> $GITHUB_ENV

      - name: Create zip file
        run: |
          mkdir -p release/"Work Tab"
          rsync -av \
            --exclude='Source/' \
            --exclude='release/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            ./ ./release/"Work Tab"
          cd release
          zip -r "../WorkTab-${{ github.ref_name }}.zip" .

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.16.0
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: WorkTab-${{ github.ref_name }}.zip
          generateReleaseNotes: true
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
