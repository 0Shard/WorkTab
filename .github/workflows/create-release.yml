name: Create Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create zip file
        run: |
          mkdir release
          rsync -av \
            --exclude='Source/' \
            --exclude='release/' \
            --exclude='.github/' \
            --exclude='.git/' \
            --exclude='.gitignore' \
            ./ ./release/
          cd release
          zip -r "../WorkTab-${{ github.ref_name }}.zip" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: WorkTab-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
